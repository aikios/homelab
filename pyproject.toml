[project]
name = "homelab"
version = "0.0.0"
description = "home server as code: reusable Python services + third-party stack configs"
requires-python = ">=3.10"
dependencies = [
    "homelab-core",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]
# TV-stack services run on their own interpreter (sports-api: a dedicated
# playwright venv; reencode-*/tv-watch: the system python3 + ffmpeg/ssh), not the
# shared workspace venv, so they are not uv packages — keep them out of member
# globbing or `uv sync` fails looking for their pyproject.toml.
exclude = [
    "services/sports-api",
    "services/tv-watch",
    "services/reencode-worker",
    "services/reencode-submit",
]

[tool.uv.sources]
homelab-core = { workspace = true }

[tool.uv]
package = false
