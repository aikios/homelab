[project]
name = "homelab"
version = "0.0.0"
description = "home server as code: reusable Python services + third-party stack configs"
requires-python = ">=3.10"
dependencies = [
    "homelab-core",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]
# Not yet a uv package (runs on the system python3); being migrated, see SPEC.md
# "Restructure plan". Excluded or `uv sync` fails looking for its pyproject.toml.
exclude = [
    "services/tv-watch",
]

[tool.uv.sources]
homelab-core = { workspace = true }

[tool.uv]
package = false
