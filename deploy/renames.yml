# How a host moves from a service's old name/layout to its new one (see SPEC.md
# "Restructure plan"). deploy/install.sh runs deploy/migrate.py <service> first;
# it is idempotent, so entries can stay after every host has migrated.
#
# <new-service>:
#   dirs:  [old service dirs]           untracked files (.env, state/, …) move over
#   paths: {old/sub/path: new/sub/path}  optional remap while moving
#   units: [old unit files]             stopped, disabled and removed on this host
#   env:   {OLD_KEY: NEW_KEY}           renamed in services/<new-service>/.env

media-transcoder:
  dirs: [reencode-worker, reencode-submit]
  paths: {state/reencode_worker.log: state/worker.log}
  units:
    - reencode-worker.service
    - reencode-submit.service
    - reencode-submit.timer
    - reencode-notify.service
    - reencode-notify.path
  env:
    FARM_SSH_HOST: MEDIA_TRANSCODER_SSH_HOST
    REMOTE_FFPROBE: MEDIA_TRANSCODER_REMOTE_FFPROBE
    FARM_STAGE: MEDIA_TRANSCODER_STAGE
    FARM_LOG: MEDIA_TRANSCODER_LOG
    FARM_REMOTE_QUEUE: MEDIA_TRANSCODER_REMOTE_QUEUE
    FARM_LOCK: MEDIA_TRANSCODER_LOCK
    FARM_QUEUE_DIR: MEDIA_TRANSCODER_QUEUE_DIR
    FARM_STABLE_SECS: MEDIA_TRANSCODER_STABLE_SECS

stream-resolver:
  dirs: [sports-api]
  units: [sports-api.service]
  env:
    SPORTS_API_PORT: STREAM_RESOLVER_PORT
    SPORTS_API_HOST: STREAM_RESOLVER_HOST
    SPORTS_MAX_CTX: STREAM_RESOLVER_MAX_CTX
    SPORTS_DELEGATE: STREAM_RESOLVER_DELEGATE
    SPORTS_SOURCE_URL: STREAM_RESOLVER_SOURCE_URL

tv-launcher:
  dirs: [tv-watch]
  paths: {payloads: static, launcher: scripts, state/tv_watch.log: state/watcher.log}
  units: [tv-watch.service]
  env:
    TV_HOST: TV_LAUNCHER_TV_HOST
    PAYLOAD_PORT: TV_LAUNCHER_PORT
