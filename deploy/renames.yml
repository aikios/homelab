# How a host moves from a service's old name/layout to its new one (see SPEC.md
# "Restructure plan"). deploy/install.sh runs deploy/migrate.py <service> first;
# it is idempotent, so entries can stay after every host has migrated.
#
# <new-service>:
#   dirs:  [old service dirs]           untracked files (.env, state/, …) move over
#   paths: {old/sub/path: new/sub/path}  optional remap while moving
#   units: [old unit files]             stopped, disabled and removed on this host
#   env:   {OLD_KEY: NEW_KEY}           renamed in services/<new-service>/.env

media-transcoder:
  dirs: [reencode-worker, reencode-submit]
  paths: {state/reencode_worker.log: state/worker.log}
  units:
    - reencode-worker.service
    - reencode-submit.service
    - reencode-submit.timer
    - reencode-notify.service
    - reencode-notify.path
  env:
    FARM_SSH_HOST: MEDIA_TRANSCODER_SSH_HOST
    REMOTE_FFPROBE: MEDIA_TRANSCODER_REMOTE_FFPROBE
    FARM_STAGE: MEDIA_TRANSCODER_STAGE
    FARM_LOG: MEDIA_TRANSCODER_LOG
    FARM_REMOTE_QUEUE: MEDIA_TRANSCODER_REMOTE_QUEUE
    FARM_LOCK: MEDIA_TRANSCODER_LOCK
    FARM_QUEUE_DIR: MEDIA_TRANSCODER_QUEUE_DIR
    FARM_STABLE_SECS: MEDIA_TRANSCODER_STABLE_SECS

stream-resolver:
  dirs: [sports-api]
  units: [sports-api.service]
  env:
    SPORTS_API_PORT: STREAM_RESOLVER_PORT
    SPORTS_API_HOST: STREAM_RESOLVER_HOST
    SPORTS_MAX_CTX: STREAM_RESOLVER_MAX_CTX
    SPORTS_DELEGATE: STREAM_RESOLVER_DELEGATE
    SPORTS_SOURCE_URL: STREAM_RESOLVER_SOURCE_URL

tv-launcher:
  dirs: [tv-watch]
  paths: {payloads: static, launcher: scripts, state/tv_watch.log: state/watcher.log}
  units: [tv-watch.service]
  env:
    TV_HOST: TV_LAUNCHER_TV_HOST
    PAYLOAD_PORT: TV_LAUNCHER_PORT


rain-notifier:
  dirs: [rain-alert]
  paths: {state/rain_alert.log: state/rain_notifier.log}
  units: [rain-alert.service, rain-alert.timer]

media-concierge:
  dirs: [mediabot]
  paths: {logs: state/logs}
  units: [mediabot.service, trash-empty.service, trash-empty.timer]
  env:
    MODEL: MEDIA_CONCIERGE_MODEL
    MAX_TOKENS: MEDIA_CONCIERGE_MAX_TOKENS
    MIN_FREE_GB: MEDIA_CONCIERGE_MIN_FREE_GB
    FFMPEG: MEDIA_CONCIERGE_FFMPEG
    FFPROBE: MEDIA_CONCIERGE_FFPROBE
    MEDIA_MOVIES: MEDIA_CONCIERGE_MOVIES_DIR
    MEDIA_SHOWS: MEDIA_CONCIERGE_SHOWS_DIR
    MEDIA_DOWNLOADS: MEDIA_CONCIERGE_DOWNLOADS_DIR
    COST_CREDIT_START_USD: MEDIA_CONCIERGE_COST_CREDIT_START_USD
    COST_WARN_USD: MEDIA_CONCIERGE_COST_WARN_USD
    COST_WARN_COOLDOWN_H: MEDIA_CONCIERGE_COST_WARN_COOLDOWN_H
    SUBS_FONT: MEDIA_CONCIERGE_SUBS_FONT
    SUBS_SIZE: MEDIA_CONCIERGE_SUBS_SIZE
    SUBS_PRIMARY: MEDIA_CONCIERGE_SUBS_PRIMARY
    SUBS_OUTLINE: MEDIA_CONCIERGE_SUBS_OUTLINE
    SUBS_ITALIC: MEDIA_CONCIERGE_SUBS_ITALIC
    SUBS_OUTLINE_W: MEDIA_CONCIERGE_SUBS_OUTLINE_W
    SUBS_MARGIN_V: MEDIA_CONCIERGE_SUBS_MARGIN_V
    SUBS_AUTOSYNC: MEDIA_CONCIERGE_SUBS_AUTOSYNC
    QBMON_SUMMARY_MIN: MEDIA_CONCIERGE_QBMON_SUMMARY_MIN
    QBMON_STALL_MIN: MEDIA_CONCIERGE_QBMON_STALL_MIN
    QBMON_FAST_PCT: MEDIA_CONCIERGE_QBMON_FAST_PCT
    QBMON_SLOW_STEP_PCT: MEDIA_CONCIERGE_QBMON_SLOW_STEP_PCT
    MEDIABOT_DEBUG_SOCK: MEDIA_CONCIERGE_DEBUG_SOCK
