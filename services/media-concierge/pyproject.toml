[project]
name = "media-concierge"
version = "0.1.0"
description = "Discord-driven Jellyfin media agent for a home server"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4",
    "discord.py>=2.4",
    "httpx>=0.27",
    "guessit>=3.8",
    "subliminal>=2.2",
    "babelfish>=0.6",
    "python-dotenv>=1.0",
    "trash-cli>=0.24",
    "ffsubsync>=0.4.20",
]

[project.scripts]
media-concierge = "media_concierge.bot:main"
media-concierge-dm = "media_concierge.debug:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_concierge"]

[tool.ruff]
line-length = 100
target-version = "py310"
