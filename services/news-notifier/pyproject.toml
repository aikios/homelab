[project]
name = "news-notifier"
version = "0.1.0"
description = "Daily Google News topic watcher that DMs new hits via the shared Discord bot"
requires-python = ">=3.10"
dependencies = ["homelab-core"]

[project.scripts]
news-notifier = "news_notifier:main"

[tool.uv.sources]
homelab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
