services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=warning
      - TZ=America/Chicago
    ports:
      - "8191:8191"
    mem_limit: 800m
    restart: unless-stopped
    networks:
      - arr
networks:
  arr:
    external: true
    name: arr-stack_default
